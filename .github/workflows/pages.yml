name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- NEW STEP: Automate PDF handling ---
      - name: Auto-Route Uploaded PDF
        run: |
          # Find the first .pdf file in the pdf directory
          PDF_FILE=$(find pdf -maxdepth 1 -name "*.pdf" | head -n 1)
          
          # If a PDF is found, and it's not already named document.pdf, copy it over
          if [ -n "$PDF_FILE" ] && [ "$PDF_FILE" != "pdf/document.pdf" ]; then
            echo "Routing $PDF_FILE to document.pdf for the live site."
            cp "$PDF_FILE" pdf/document.pdf
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
