<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Landing | Live AI Support</title>
    <script type="module" src="script.js" defer></script>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --text-color: #F3EDE2;
            --accent-color: #50C878; /* The emerald green you liked */
            --chat-bg: #1C1C1E;
        }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .hero {
            text-align: center;
            max-width: 800px;
            padding: 20px;
        }
        h1 { font-size: 3rem; margin-bottom: 10px; }
        p { font-size: 1.2rem; color: #aaa; line-height: 1.6; }
        
        /* Chat Widget Styles */
        #chat-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 350px;
            height: 500px;
            background-color: var(--chat-bg);
            border: 1px solid #333;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            transform: translateY(150%);
            transition: transform 0.3s ease-in-out;
        }
        #chat-widget.open { transform: translateY(0); }
        
        #chat-header {
            background-color: var(--accent-color);
            color: #000;
            padding: 15px;
            font-weight: bold;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            display: flex;
            justify-content: space-between;
            cursor: pointer;
        }
        #chat-history {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg { padding: 10px 15px; border-radius: 8px; max-width: 80%; line-height: 1.4; }
        .msg.user { background-color: #333; align-self: flex-end; }
        .msg.ai { background-color: rgba(80, 200, 120, 0.2); border: 1px solid var(--accent-color); align-self: flex-start; }
        
        #chat-input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #333;
        }
        #chat-input {
            flex-grow: 1;
            background: #000;
            border: 1px solid #444;
            color: white;
            padding: 10px;
            border-radius: 6px;
            outline: none;
        }
        #send-btn {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 15px;
            margin-left: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        
        #chat-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(80,200,120,0.4);
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Welcome to the Future.</h1>
        <p>This is an experimental landing page. Test our live Gemini-powered customer service agent by clicking the chat bubble in the bottom right corner.</p>
    </div>

    <button id="chat-toggle">💬 Chat with Support</button>

    <div id="chat-widget">
        <div id="chat-header">
            <span>Gemini Live Agent</span>
            <span id="close-chat">✖</span>
        </div>
        <div id="chat-history">
            <div class="msg ai">Hello! I'm the experimental Gemini agent. How can I help you today?</div>
        </div>
        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Type a message...">
            <button id="send-btn">Send</button>
        </div>
    </div>
</body>
</html>
